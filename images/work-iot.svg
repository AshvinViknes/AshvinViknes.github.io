<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace,Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18191b"/><stop offset=".6" stop-color="#1f2124"/><stop offset="1" stop-color="#2a2c30"/>
    </linearGradient>
    <linearGradient id="nd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8eff" stop-opacity=".24"/><stop offset="1" stop-color="#3b8eff" stop-opacity=".08"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- meter dial -->
  <circle cx="200" cy="200" r="110" fill="url(#nd)" stroke="#3b8eff" stroke-width="4"/>
  <path d="M120 255 A96 96 0 1 1 280 255" fill="none" stroke="#4a4c51" stroke-width="7" stroke-linecap="round"/>
  <path d="M120 255 A96 96 0 0 1 152 92" fill="none" stroke="#3b8eff" stroke-width="7" stroke-linecap="round"/>
  <line x1="200" y1="200" x2="262" y2="118" stroke="#eff0f1" stroke-width="6" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="11" fill="#eff0f1"/>
  <text x="152" y="352" fill="#fff" font-size="24">4.2 kWh</text>
  <text x="110" y="394" fill="#8cbcff" font-size="18">smart meter · NodeMCU · CT coil</text>
  <!-- live waveform -->
  <rect x="400" y="86" width="330" height="190" rx="14" fill="rgba(11,18,32,.5)" stroke="#4a4c51" stroke-width="2.5"/>
  <polyline points="420,210 450,205 470,150 490,230 515,160 540,200 565,130 590,215 615,170 640,240 665,145 690,195 712,180"
            fill="none" stroke="#3b8eff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M420 246 H712" stroke="#4a4c51" stroke-width="1.5" stroke-dasharray="5 6"/>
  <text x="420" y="120" fill="#9c9ea3" font-size="16">live consumption</text>
  <!-- theft alert -->
  <rect x="400" y="306" width="330" height="62" rx="12" fill="rgba(255,95,87,.12)" stroke="#ff5f57" stroke-width="2.5"/>
  <circle cx="434" cy="337" r="10" fill="#ff5f57"/>
  <text x="458" y="344" fill="#ffd3d0" font-size="18">theft detected → alert sent</text>
</svg>
