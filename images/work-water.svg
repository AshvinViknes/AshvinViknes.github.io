<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace,Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18191b"/><stop offset=".6" stop-color="#1f2124"/><stop offset="1" stop-color="#2a2c30"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8eff" stop-opacity=".75"/><stop offset="1" stop-color="#3b8eff" stop-opacity=".45"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- tank -->
  <rect x="120" y="70" width="280" height="300" rx="18" fill="rgba(11,18,32,.5)" stroke="#eff0f1" stroke-width="4"/>
  <path d="M132 190 q35 -16 70 0 t70 0 t70 0 t56 0 V352 a16 16 0 0 1 -16 16 H148 a16 16 0 0 1 -16 -16 Z" fill="url(#water)"/>
  <g stroke="#9c9ea3" stroke-width="2.5"><path d="M402 130 h20"/><path d="M402 190 h20"/><path d="M402 250 h20"/><path d="M402 310 h20"/></g>
  <text x="434" y="137" fill="#9c9ea3" font-size="16">100%</text>
  <text x="434" y="197" fill="#fff" font-size="17">78%</text>
  <text x="434" y="257" fill="#9c9ea3" font-size="16">50%</text>
  <text x="434" y="317" fill="#9c9ea3" font-size="16">25%</text>
  <!-- inlet pipe + valve -->
  <path d="M260 70 V36 H640 V120" fill="none" stroke="#6b6d72" stroke-width="8" stroke-linecap="round"/>
  <circle cx="640" cy="150" r="30" fill="none" stroke="#3b8eff" stroke-width="4"/>
  <path d="M640 132 V168 M622 150 H658" stroke="#3b8eff" stroke-width="4"/>
  <text x="588" y="214" fill="#9c9ea3" font-size="16">valve: auto</text>
  <!-- controller card -->
  <rect x="540" y="250" width="200" height="118" rx="12" fill="rgba(56,198,255,.10)" stroke="#4a4c51" stroke-width="2.5"/>
  <text x="564" y="290" fill="#fff" font-size="18">level: 78%</text>
  <text x="564" y="320" fill="#9c9ea3" font-size="16">flow: closing</text>
  <text x="564" y="348" fill="#9c9ea3" font-size="16">overflow: none</text>
  <text x="120" y="412" fill="#8cbcff" font-size="18">precise level · intelligent flow control</text>
