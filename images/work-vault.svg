<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" font-family="ui-monospace,Menlo,monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18191b"/><stop offset=".6" stop-color="#1f2124"/><stop offset="1" stop-color="#2a2c30"/>
    </linearGradient>
    <linearGradient id="nd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b8eff" stop-opacity=".28"/><stop offset="1" stop-color="#3b8eff" stop-opacity=".10"/>
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <!-- padlock -->
  <rect x="110" y="190" width="180" height="150" rx="20" fill="url(#nd)" stroke="#3b8eff" stroke-width="4"/>
  <path d="M145 190 V150 a55 55 0 0 1 110 0 V190" fill="none" stroke="#eff0f1" stroke-width="7"/>
  <circle cx="200" cy="252" r="17" fill="#eff0f1"/>
  <rect x="192" y="260" width="16" height="36" rx="7" fill="#eff0f1"/>
  <text x="110" y="394" fill="#8cbcff" font-size="19">POST /namespaces/prod/secrets</text>
  <!-- secret rows -->
  <g stroke="#eff0f1" stroke-width="2.5">
    <rect x="380" y="92"  width="330" height="60" rx="12" fill="url(#nd)"/>
    <rect x="380" y="176" width="330" height="60" rx="12" fill="url(#nd)"/>
    <rect x="380" y="260" width="330" height="60" rx="12" fill="url(#nd)"/>
  </g>
  <text x="406" y="130" fill="#9c9ea3" font-size="17">db-password</text><text x="596" y="130" fill="#fff" font-size="17">••••••</text>
  <text x="406" y="214" fill="#9c9ea3" font-size="17">api-token</text><text x="596" y="214" fill="#fff" font-size="17">••••••</text>
  <text x="406" y="298" fill="#9c9ea3" font-size="17">tls-cert</text><text x="596" y="298" fill="#fff" font-size="17">••••••</text>
  <!-- k8s wheel hint -->
  <g transform="translate(545,372)" stroke="#3b8eff" stroke-width="3" fill="none">
    <circle r="26"/><path d="M0 -26 V26 M-26 0 H26 M-18 -18 L18 18 M-18 18 L18 -18"/>
  </g>
  <text x="600" y="380" fill="#8cbcff" font-size="18">kubernetes</text>
</svg>
